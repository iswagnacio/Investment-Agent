[project]
name = "investment"
version = "0.1.0"
description = "AI-powered stock evaluation pipeline (multi-agent, cached perspectives)"
requires-python = ">=3.11"
dependencies = [
    # Pinned to the versions in the `invest` conda env (2026-07-03).
    # The langchain 0.1.x pins are load-bearing: agents use the legacy
    # AgentExecutor / create_react_agent APIs removed in later majors.
    "langchain==0.1.0",
    "langchain-anthropic==0.1.4",
    "langchain-community==0.0.20",
    "langchain-core==0.1.23",
    "anthropic>=0.76,<1",
    "pandas>=2.3,<3",
    "numpy>=1.26,<2",
    "yfinance>=1.1,<2",
    "yfinance-cache>=0.7,<1",
    "requests>=2.32,<3",
    "python-dotenv>=1.2,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Flat layout for now; Phase 4 of ROADMAP.md migrates to packages.
py-modules = [
    "config",
    "contracts",
    "registry",
    "reporting",
    "runner",
    "lead_agent",
    "technical",
    "technical_agent",
    "fundamental",
    "fundamental_agent",
    "sentiment",
    "sentiment_agent",
    "perspective_agent",
    "portfolio",
    "portfolio_agent",
    "distill_investor",
    "X_fetch",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
